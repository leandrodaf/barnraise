<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">One account, logged in on every machine at once</title><desc id="d">From the panel, the desktop app or the CLI the owner starts the login of one account on every machine. Each machine runs the provider&#x27;s own login in its own folder and shows its link and code; the owner signs in once per machine, in any order. Only the steps travel between machines, never a credential. The account then runs on those machines only, and each machine runs as many agents as its cores and memory allow.</desc>
<defs><marker id="a0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker><marker id="a1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="a1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker><marker id="a57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker><marker id="a6e7781" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker><marker id="a8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker><marker id="abc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bc4c00"/></marker><marker id="acf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker><marker id="ad0d7de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d0d7de"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="779" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="40" y="52" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start">One account, every machine, one screen</text>
<text x="40" y="80" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">Each machine runs the provider&#x27;s own login and keeps it. Only the steps of the login travel; a credential never does.</text>
<rect x="40" y="150" width="250" height="110" rx="8" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.2"/>
<text x="165.0" y="192.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Accounts → Log in</text>
<text x="165.0" y="211.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">panel, desktop app, or</text>
<text x="165.0" y="229.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">barnraise account login claude --all</text>
<rect x="390" y="150" width="270" height="110" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="525.0" y="183.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">The daemon you talk to</text>
<text x="525.0" y="202.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">starts the login here</text>
<text x="525.0" y="220.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">and asks the paired machines:</text>
<text x="525.0" y="238.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">start · state · code · cancel</text>
<path d="M 290 205 L 390 205" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a57606a)"/>
<text x="340.0" y="197.0" font-size="12" fill="#57606a" font-weight="400" text-anchor="middle">claude or codex</text>
<text x="525" y="288" font-size="12" fill="#8250df" font-weight="400" text-anchor="middle">to the other machines over NATS, signed with nkeys</text>
<rect x="800" y="150" width="360" height="110" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
<text x="980.0" y="183.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Machine A</text>
<text x="980.0" y="202.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">claude auth login · codex login --device-auth</text>
<text x="980.0" y="220.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">in accounts/&lt;id&gt; under its own data folder</text>
<text x="980.0" y="238.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">prints a link, and a one-time code (codex)</text>
<rect x="800" y="290" width="360" height="110" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
<text x="980.0" y="323.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Machine B</text>
<text x="980.0" y="342.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">claude auth login · codex login --device-auth</text>
<text x="980.0" y="360.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">in accounts/&lt;id&gt; under its own data folder</text>
<text x="980.0" y="378.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">prints a link, and a one-time code (codex)</text>
<rect x="800" y="430" width="360" height="110" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
<text x="980.0" y="463.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Machine C</text>
<text x="980.0" y="482.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">claude auth login · codex login --device-auth</text>
<text x="980.0" y="500.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">in accounts/&lt;id&gt; under its own data folder</text>
<text x="980.0" y="518.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">prints a link, and a one-time code (codex)</text>
<path d="M 660 205 L 800 205" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a8250df)"/>
<path d="M 660 230 L 730 230 L 730 345 L 800 345" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a8250df)"/>
<path d="M 730 345 L 730 485 L 800 485" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a8250df)"/>
<rect x="40" y="470" width="620" height="110" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="350.0" y="503.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">One block per machine, side by side</text>
<text x="350.0" y="522.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">open the page · type the code there (codex), or paste back the page&#x27;s code (claude)</text>
<text x="350.0" y="540.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">sign in once for each machine, in any order; a login nobody finishes ends in 20 min</text>
<text x="350.0" y="558.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">each one says Waiting for you · Logged in · Failed · Stopped</text>
<path d="M 800 525 L 660 525" fill="none" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a1a7f37)"/>
<text x="730" y="515" font-size="12" fill="#1a7f37" font-weight="400" text-anchor="middle">link, code and state, live</text>
<rect x="40" y="620" width="1120" height="120" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="62" y="646" font-size="13" fill="#1f2328" text-anchor="start"><tspan font-weight="600">When a login ends well,</tspan> the account lists the machines where it is logged in; a machine not listed never picks it.</text>
<text x="62" y="666" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">Each machine runs as many agents at once as its cores and memory allow (2 cores and 4 GB per agent, 2 GB for the system)</text>
<text x="62" y="686" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">and says which one bounds it; the owner may set the number per machine (barnraise machine agents 5 --machine B).</text>
<text x="62" y="706" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">Usage windows (5 hours, week) come from the sessions themselves; the least loaded account with room takes the next step.</text>
</svg>
