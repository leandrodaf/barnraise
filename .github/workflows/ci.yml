name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci-changes.sh

  test:
    name: tests with -race and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/go-setup
        with:
          name: test
      - name: git identity for the tests
        run: |
          git config --global user.name "barnraise-ci"
          git config --global user.email "ci@barnraise.invalid"
          git config --global init.defaultBranch main
      - name: go test -race, with the coverage floor of internal/domain and internal/app
        run: make cover
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out
      - uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.go.outputs.key }}

  lint:
    name: vet, lint, vuln
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/go-setup
        with:
          name: lint
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (with the depguard architecture rules)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.go.outputs.key }}

  proto:
    name: buf lint and breaking
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf breaking against main
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$(git rev-list --count HEAD)" -le 1 ]; then
            echo "First commit; nothing to compare against."
            exit 0
          fi
          if [ "$EVENT" = "push" ]; then
            # On main itself, compare with the previous commit.
            buf breaking --against ".git#ref=HEAD~1"
          else
            if ! git fetch --no-tags origin main:main 2>/dev/null; then
              echo "No main branch yet; nothing to compare against."
              exit 0
            fi
            buf breaking --against '.git#branch=main'
          fi

  e2e:
    name: end-to-end and cluster tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/go-setup
        with:
          name: e2e
      - name: git (the e2e tests drive real git)
        run: |
          git --version
          git config --global user.name "barnraise-ci"
          git config --global user.email "ci@barnraise.invalid"
          git config --global init.defaultBranch main
      - name: e2e
        env:
          BARNRAISE_NO_TAILSCALE: "1"
        run: go test -race -timeout 20m -run 'TestEndToEnd|TestTwoMachines' ./cmd/barnraise
      - name: smoke with the built binary (fake provider)
        run: make smoke
      - uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.go.outputs.key }}

  build:
    name: build linux and darwin, amd64 and arm64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/go-setup
        with:
          name: build
      - name: go build, four targets on one runner (one cache, one startup)
        run: make cross
      - uses: actions/upload-artifact@v7
        with:
          name: barnraise
          path: dist/
      - uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.go.outputs.key }}
