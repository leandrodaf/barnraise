<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How Barnraise connects to GitHub</title><desc id="d">Each Barnraise item is mirrored as a GitHub issue, has a branch and a draft pull request, runs checks through GitHub Actions and lands on main as one squash commit. GitHub webhooks bring pushes, check results, new issues and approvals back.</desc>
<defs><marker id="a1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker><marker id="a57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker><marker id="a0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker><marker id="a1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="abc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bc4c00"/></marker><marker id="a8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker><marker id="acf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="629" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="40" y="44" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">How Barnraise connects to GitHub</text>
<text x="40" y="68" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">The daemon owns the state of the flow. GitHub is where people read, comment and review — kept in sync both ways.</text>
<text x="240.0" y="104" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Barnraise (the daemon)</text>
<text x="960.0" y="104" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">GitHub</text>
<rect x="40" y="122" width="400" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="240.0" y="163.25" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Item I-42</text>
<text x="240.0" y="180.75" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">status, step, criteria, priority, area</text>
<rect x="760" y="122" width="400" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="960.0" y="154.5" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Issue “[I-42] Title”</text>
<text x="960.0" y="172.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">labels barnraise, area:…, kind:…, status:…, P1</text>
<text x="960.0" y="189.5" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">moved between the columns of the Project</text>
<line x1="444" y1="152" x2="754" y2="152" stroke="#0969da" stroke-width="1.6" marker-end="url(#a0969da)"/>
<text x="600" y="144" font-size="12" fill="#0969da" font-weight="400" text-anchor="middle">creates and keeps it up to date</text>
<line x1="756" y1="184" x2="446" y2="184" stroke="#0969da" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a0969da)"/>
<text x="600" y="202" font-size="12" fill="#0969da" font-weight="400" text-anchor="middle">new issues, comments, “/barnraise approve plan I-42”</text>
<rect x="40" y="230" width="400" height="88" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
<text x="240.0" y="271.25" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Branch br/I-42-title</text>
<text x="240.0" y="288.75" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">one worktree, one commit per step</text>
<rect x="760" y="230" width="400" height="88" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
<text x="960.0" y="262.5" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Draft pull request</text>
<text x="960.0" y="280.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">opened at the first step, updated at each one,</text>
<text x="960.0" y="297.5" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">marked ready after the review, with its verdict</text>
<line x1="444" y1="274" x2="754" y2="274" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#abc4c00)"/>
<text x="600" y="266" font-size="12" fill="#bc4c00" font-weight="400" text-anchor="middle">pushes the branch, opens and updates the PR</text>
<rect x="40" y="338" width="400" height="88" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="240.0" y="379.25" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Check  runs_on: github-actions</text>
<text x="240.0" y="396.75" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">or local, machine:&lt;label&gt;, webhook</text>
<rect x="760" y="338" width="400" height="88" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="960.0" y="370.5" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">GitHub Actions workflow</text>
<text x="960.0" y="388.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">inputs item, commit and check;</text>
<text x="960.0" y="405.5" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">local check results show as commit statuses</text>
<line x1="444" y1="368" x2="754" y2="368" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#a1a7f37)"/>
<text x="600" y="360" font-size="12" fill="#1a7f37" font-weight="400" text-anchor="middle">dispatches the workflow</text>
<line x1="756" y1="400" x2="446" y2="400" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a1a7f37)"/>
<text x="600" y="418" font-size="12" fill="#1a7f37" font-weight="400" text-anchor="middle">check_run / workflow_run result</text>
<rect x="40" y="446" width="400" height="88" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/>
<text x="240.0" y="487.25" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Merge queue</text>
<text x="240.0" y="504.75" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">rebase, check again, squash</text>
<rect x="760" y="446" width="400" height="88" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/>
<text x="960.0" y="478.5" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">main</text>
<text x="960.0" y="496.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">one commit “I-42: Title”</text>
<text x="960.0" y="513.5" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">with the trailer Barnraise-Item: I-42</text>
<line x1="444" y1="476" x2="754" y2="476" stroke="#8250df" stroke-width="1.6" marker-end="url(#a8250df)"/>
<text x="600" y="468" font-size="12" fill="#8250df" font-weight="400" text-anchor="middle">fast-forward push (the only writer of main)</text>
<line x1="756" y1="508" x2="446" y2="508" stroke="#8250df" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a8250df)"/>
<text x="600" y="526" font-size="12" fill="#8250df" font-weight="400" text-anchor="middle">push to main → items it affects are revalidated</text>
<rect x="40" y="556" width="1120" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="60" y="577" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">Solid arrows are calls to the GitHub API with a token kept in the system keychain. Dashed arrows are webhooks to</text>
<text x="60" y="595" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">POST /v1/webhooks/github, verified with HMAC; without webhooks the daemon polls the tracker. Text from GitHub is sanitized and fenced as untrusted.</text>
</svg>
