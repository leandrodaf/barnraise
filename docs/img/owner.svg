<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The owner decides, the advisor helps</title><desc id="d">What waits for the owner (questions, approvals, proposals) reaches the panel, the desktop app or the CLI. The owner answers, or talks it over with the advisor, a read-only session on the strongest model that suggests an answer; the owner confirms it, edits it, asks more, or lets the advisor decide. Proposals can be triaged all at once and are applied only when the owner confirms.</desc>
<defs><marker id="a0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker><marker id="a1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="a1f2328" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker><marker id="a57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker><marker id="a6e7781" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker><marker id="a8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker><marker id="abc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bc4c00"/></marker><marker id="acf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker><marker id="ad0d7de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d0d7de"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="639" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="40" y="52" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start">The owner decides; the advisor helps</text>
<text x="40" y="80" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">Nothing waits on a terminal. Every decision reaches one place, with the context and a suggested answer.</text>
<text x="160" y="128" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">What waits for you</text>
<rect x="40" y="142" width="240" height="70" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
<text x="160.0" y="173.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Questions</text>
<text x="160.0" y="192.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">an agent cannot go on without you</text>
<rect x="40" y="226" width="240" height="70" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/>
<text x="160.0" y="257.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Approvals</text>
<text x="160.0" y="276.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">the plan, or the delivery</text>
<rect x="40" y="310" width="240" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="160.0" y="341.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Proposals</text>
<text x="160.0" y="360.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">ideas the agents brought</text>
<rect x="400" y="190" width="280" height="140" rx="8" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.2"/>
<text x="540.0" y="238.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">You, the owner</text>
<text x="540.0" y="257.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">web panel · desktop app · CLI</text>
<text x="540.0" y="275.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">answer right where it shows,</text>
<text x="540.0" y="293.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">or talk it over first</text>
<path d="M 280 177 L 400 260" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a57606a)"/>
<path d="M 280 261 L 400 260" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a57606a)"/>
<path d="M 280 345 L 400 260" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a57606a)"/>
<rect x="820" y="142" width="340" height="238" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="990.0" y="212.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Advisor</text>
<text x="990.0" y="231.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">the strongest model of the project</text>
<text x="990.0" y="249.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">reads the item, the question, the timeline</text>
<text x="990.0" y="267.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">and the code, in the item&#x27;s worktree</text>
<text x="990.0" y="285.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">never changes a file, runs nothing</text>
<text x="990.0" y="303.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">shows live what it reads and searches</text>
<text x="990.0" y="321.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">ends with a suggested answer</text>
<path d="M 680 236 L 820 236" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#a0969da)"/>
<text x="750.0" y="228.0" font-size="12" fill="#0969da" font-weight="400" text-anchor="middle">Talk it over</text>
<path d="M 820 290 L 680 290" fill="none" stroke="#0969da" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a0969da)"/>
<text x="750.0" y="282.0" font-size="12" fill="#0969da" font-weight="400" text-anchor="middle">suggested answer</text>
<rect x="400" y="410" width="180" height="82" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="490.0" y="438.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Confirm · Edit</text>
<text x="490.0" y="457.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">send the suggested</text>
<text x="490.0" y="475.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">answer, or your own</text>
<rect x="600" y="410" width="180" height="82" rx="8" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.2"/>
<text x="690.0" y="438.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Ask more</text>
<text x="690.0" y="457.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">the conversation</text>
<text x="690.0" y="475.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">goes on</text>
<rect x="800" y="410" width="180" height="82" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.2"/>
<text x="890.0" y="438.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Decide for me</text>
<text x="890.0" y="457.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">the advisor answers;</text>
<text x="890.0" y="475.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">kept as delegated</text>
<rect x="1000" y="410" width="160" height="82" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
<text x="1080.0" y="438.0" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Triage</text>
<text x="1080.0" y="457.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">every proposal,</text>
<text x="1080.0" y="475.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="middle">8 per answer</text>
<path d="M 540 330 L 490 410" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a57606a)"/>
<path d="M 600 330 L 690 410" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a57606a)"/>
<path d="M 890 380 L 890 410" fill="none" stroke="#8250df" stroke-width="1.6" marker-end="url(#a8250df)"/>
<path d="M 1080 380 L 1080 410" fill="none" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#abc4c00)"/>
<rect x="40" y="520" width="1120" height="88" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="62" y="546" font-size="13" fill="#1f2328" text-anchor="start"><tspan font-weight="600">After the answer:</tspan> The item goes on at once; your words and the reasons of the advisor travel with it to the next agent&#x27;s prompt.</text>
<text x="62" y="566" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">A triage applies nothing by itself: you see approve, reject or later for each proposal, keep the ones you agree with and apply them.</text>
</svg>
