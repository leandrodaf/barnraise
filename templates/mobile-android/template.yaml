# Android app: plan, cheap critic before emulators, Maestro flows on machines with emulators, design review.
roles:
  designer: { class: normal, count: 1, reviewer: true, needs: [emulators] }
checks:
  main:    { run: ./gradlew testDebugUnitTest --console=plain, runs_on: local, scope: touched }
  maestro: { run: maestro test .maestro, runs_on: "machine:emulators", scope: touched }
kinds:
  feature: feature-mobile
  improvement: feature-mobile
flows:
  feature-mobile:
    steps:
      plan:       { role: implementer, output: plan.md, approve: analyst }
      implement:  { role: implementer, class: auto }
      quick-look: { role: critic, model: haiku }
      check:      { run: checks.main, scope: touched }
      maestro:    { run: checks.maestro, scope: touched }
      design:     { role: designer, model_family: different_from(implement) }
      analyst:    { role: analyst }
      integrate:  { run: merge_queue }
    rework:
      quick-look.fail: implement
      check.fail: implement
      maestro.fail: implement
      design.reject: implement
      analyst.rework: implement
      limit: { same_model: 3, escalate: 2, then: owner }
  bug:
    steps:
      reproduce:  { role: implementer, output: failing_test }
      implement:  { role: implementer }
      check:      { run: checks.main, require: failing_test_now_passes }
      review:     { role: reviewer, model_family: different_from(implement) }
      integrate:  { run: merge_queue }
    rework:
      check.fail: implement
      review.reject: implement
policy:
  deny_write: ["**/release.keystore", "**/google-services.json", "fastlane/**"]
