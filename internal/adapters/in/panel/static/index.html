<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Barnraise</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" type="module"></script>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>Barnraise</span></div>
  <label class="project"><span class="sr" id="project-label">Project</span>
    <select id="project" aria-labelledby="project-label"></select>
  </label>
  <span id="live" class="live" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="live-text"></span></span>
  <button id="logout" class="ghost small" type="button"></button>
</header>
<nav id="nav" class="nav" aria-label="Screens"></nav>
<main id="view" class="view" tabindex="-1"></main>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>Barnraise needs JavaScript.</noscript>
</body>
</html>
