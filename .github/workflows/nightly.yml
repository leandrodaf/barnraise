name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz smoke (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: fuzz every target
        run: make fuzz-smoke FUZZTIME=60s
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/**"

  real-claude-smoke:
    # Placeholder for the nightly smoke with real Claude Code on a tiny
    # repository, measuring tokens. It only runs when the repository has the
    # CLAUDE_CODE_OAUTH_TOKEN secret (a long-lived token from
    # `claude setup-token`); otherwise the job is skipped.
    name: real Claude Code smoke
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: check for the secret
        id: secret
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "CLAUDE_CODE_OAUTH_TOKEN is not set; skipping."; fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.present == 'true'
      - uses: actions/setup-go@v5
        if: steps.secret.outputs.present == 'true'
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.present == 'true'
        with:
          node-version: "22"
      - name: install Claude Code
        if: steps.secret.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: smoke
        if: steps.secret.outputs.present == 'true'
        env:
          DISABLE_AUTOUPDATER: "1"
          BARNRAISE_NO_TAILSCALE: "1"
        run: |
          git config --global user.name "barnraise-ci"
          git config --global user.email "ci@barnraise.invalid"
          git config --global init.defaultBranch main
          make build
          # TODO: drive a tiny repository from `barnraise init` to one
          # integrated item with a real Claude account and report the tokens
          # per step (barnraise metrics --json). Until that script exists,
          # check that the CLI and the account answer.
          claude --version
          ./barnraise version
