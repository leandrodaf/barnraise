// Barnraise public API, version 1.
//
// One service answers gRPC (binary) and HTTP with JSON (Connect protocol),
// and the OpenAPI document is generated from this file. Field names match
// the JSON the daemon uses everywhere (snake_case), and every resource uses
// the glossary words: projects, goals, focus, items, proposals, deliveries,
// reviews, checks, agents, accounts, machines, events.
syntax = "proto3";

package barnraise.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/leandrodaf/barnraise/gen/barnraise/v1;barnraisev1";

// ---------- entities ----------

message Criterion {
  string id = 1;
  string text = 2;
  string check = 3;
  bool met = 4;
  string evidence = 5;
}

message Anchors {
  repeated string files = 1;
  repeated string symbols = 2;
  repeated string areas = 3;
  repeated string screens = 4;
  repeated string contracts = 5;
  repeated string decisions = 6;
  repeated string specs = 7;
  string base = 8;
}

message ReworkRecord {
  string from = 1;
  string to = 2;
  string by = 3;
  string reason = 4;
  string outcome = 5;
  int32 tier = 6;
  string at = 7;
}

message Claim {
  string machine = 1;
  string agent = 2;
  string since = 3;
}

message StepRun {
  string agent = 1;
  string account = 2;
  string provider = 3;
  string model = 4;
  string family = 5;
}

message Item {
  string id = 1;
  int32 version = 2;
  string title = 3;
  string body = 4;
  string kind = 5;
  int32 priority = 6;
  string lane = 7;
  string area = 8;
  string goal_id = 9;
  string size = 10;
  string class = 11;
  string status = 12;
  string step = 13;
  repeated Criterion criteria = 14;
  repeated string preserve = 15;
  repeated string clarifications = 16;
  Anchors anchors = 17;
  repeated string deps = 18;
  repeated string tweaks = 19;
  repeated string checklist = 20;
  repeated ReworkRecord rework = 21;
  int32 tier = 22;
  Claim claim = 23;
  string branch = 24;
  string pr = 25;
  string tracker_ref = 26;
  bool risky = 27;
  bool parked = 28;
  string closed_reason = 29;
  string closed_by = 30;
  string waiting_question = 31;
  string validated_at = 32;
  string created_at = 33;
  string updated_at = 34;
  string step_started_at = 35;
  string integrated_at = 36;
  string merge_commit = 37;
  repeated string files_touched = 38;
  map<string, StepRun> runs = 39;
  int32 attempts = 40;
  ChangeNote change = 41;
  // Locked files (existing tests, references) this item may change.
  repeated string unlocked = 42;
  // The entry's web page in the tracker, when the tracker said it.
  string tracker_url = 43;
}

message Goal {
  string id = 1;
  string name = 2;
  string done_when = 3;
  string inventory = 4;
  bool active = 5;
  string created_at = 6;
  string finished_at = 7;
  int32 budget_pct = 8;
}

message GoalProgress {
  int32 total = 1;
  int32 done = 2;
  double per_day = 3;
  string forecast = 4;
  int32 percentage = 5;
}

message Focus {
  string name = 1;
  string area = 2;
  repeated string items = 3;
  string until = 4;
  int32 share = 5;
  string set_by = 6;
  string set_at = 7;
  bool cancelled = 8;
}

message FocusEffect {
  int32 focus_items = 1;
  repeated string parked_elsewhere = 2;
  int32 share = 3;
}

message Proposal {
  string id = 1;
  int32 version = 2;
  string title = 3;
  string problem = 4;
  string evidence = 5;
  string impact = 6;
  string size = 7;
  string area = 8;
  string goal_link = 9;
  string kind = 10;
  int32 priority = 11;
  string by = 12;
  string status = 13;
  repeated string comments = 14;
  string reason = 15;
  string item_id = 16;
  string created_at = 17;
  string decided_at = 18;
  string decided_by = 19;
  string later_until = 20;
  // blocks: the proposing item cannot be delivered without it; it becomes
  // an item at once, which the proposing item waits for.
  bool blocks = 21;
  // from_item: the item whose session found it.
  string from_item = 22;
}

message ProposalGroup {
  string area = 1;
  repeated Proposal proposals = 2;
}

message Tweak {
  string id = 1;
  string area = 2;
  string text = 3;
  string by = 4;
  string created_at = 5;
  string item_id = 6;
}

message Option {
  string label = 1;
  bool recommended = 2;
}

message Question {
  string id = 1;
  int32 version = 2;
  string item_id = 3;
  string context = 4;
  string decision = 5;
  repeated Option options = 6;
  string if_no_answer = 7;
  string asked_by = 8;
  string asked_at = 9;
  string deadline = 10;
  string answer = 11;
  string answered_by = 12;
  string answered_at = 13;
  bool urgent = 14;
}

message Message {
  string id = 1;
  string from = 2;
  string to = 3;
  string item_id = 4;
  string text = 5;
  string at = 6;
  bool delivered = 7;
}

message CriterionMark {
  string id = 1;
  bool met = 2;
  string evidence = 3;
}

message Delivery {
  string item_id = 1;
  string step = 2;
  string agent = 3;
  // DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT or BLOCKED.
  string status = 4;
  string summary = 5;
  repeated CriterionMark criteria = 6;
  repeated string files = 7;
  repeated string concerns = 8;
  string reason = 9;
  string commit = 10;
  string at = 11;
  // How the change is described on main, in English.
  ChangeNote change = 12;
  // With BLOCKED: the items that must be integrated before this step can go
  // on. They become dependencies and the item waits for them, without a
  // question to the owner.
  repeated string waits_for = 13;
}

// ChangeNote describes a change in the form of Conventional Commits. It
// becomes the header of the commit that lands and a line of the changelog.
message ChangeNote {
  // feat, fix, perf, refactor, docs, test, build, ci, chore, style or revert.
  string type = 1;
  // The part of the product: api, web, mobile…
  string scope = 2;
  // Imperative, lower case, no final period, in English.
  string subject = 3;
  // Why, and what changes for people. Optional.
  string body = 4;
  // What breaks and how to migrate. Empty when nothing does.
  string breaking = 5;
}

message Finding {
  string area = 1;
  string file = 2;
  int32 line = 3;
  string severity = 4;
  string text = 5;
}

message Review {
  string item_id = 1;
  string step = 2;
  string reviewer = 3;
  // pass or fail: does it meet the criteria?
  string criteria_verdict = 4;
  // pass or fail: is the code good?
  string code_verdict = 5;
  // APPROVE, REWORK or REJECT.
  string decision = 6;
  repeated Finding findings = 7;
  string summary = 8;
  string family = 9;
  string at = 10;
}

message CheckResult {
  string id = 1;
  string item_id = 2;
  string check = 3;
  string commit = 4;
  bool passed = 5;
  bool flaky = 6;
  string summary = 7;
  string log_path = 8;
  string log_hash = 9;
  repeated string artifacts = 10;
  int64 duration = 11;
  repeated string criteria = 12;
  string runs_on = 13;
  string at = 14;
}

message Usage {
  double five_hour_pct = 1;
  double weekly_pct = 2;
  double weekly_top_pct = 3;
  string five_hour_resets = 4;
  string weekly_resets = 5;
  double context_pct = 6;
  string updated_at = 7;
  string source = 8;
}

// UsageWindow is one usage window seen from now.
message UsageWindow {
  double used_pct = 1;
  // Where even use over the window would be now.
  double pace_pct = 2;
  // Seconds to the reset, and to 100% at the current rate when that comes first.
  double resets_in = 3;
  double runs_out_in = 4;
}

// AccountOutlook is what the owner needs to know about an account now.
message AccountOutlook {
  // The account cannot take a step now.
  bool limited = 1;
  UsageWindow five_hour = 2;
  UsageWindow weekly = 3;
  UsageWindow weekly_top = 4;
}

message Account {
  string id = 1;
  string provider = 2;
  string plan = 3;
  string config_dir = 4;
  string linux_user = 5;
  string machine = 6;
  double ceiling_pct = 7;
  string status = 8;
  Usage usage = 9;
  repeated string projects = 10;
  string added_at = 11;
  // The account seen from now; only in answers, never stored.
  AccountOutlook outlook = 12;
  // Machines where the account was logged in from the panel or with
  // `barnraise account login`, each with its own login under its data dir.
  // With any name here, only these machines (and `machine`) use the account.
  repeated string machines = 13;
}

message Machine {
  string name = 1;
  string version = 2;
  string address = 3;
  int32 cpus = 4;
  double mem_gb = 5;
  double free_cpu = 6;
  int32 emulators = 7;
  bool gpu = 8;
  repeated string labels = 9;
  int32 slots = 10;
  int32 busy = 11;
  repeated string accounts = 12;
  string last_seen = 13;
  bool leaving = 14;
  bool left = 15;
  // green, yellow, red (gray when it left).
  string health = 16;
  string platform = 17;
  // sha256 of the machine's barnraise binary (single version across the cluster).
  string binary = 18;
  // Live readings, refreshed with every heartbeat; 0 = the machine does not report it.
  double free_mem_gb = 19;
  // 1-minute load average.
  double load1 = 20;
  // CPU temperature in degrees Celsius.
  double temp_c = 21;
  repeated GpuStat gpus = 22;
  // The machine is in standby: its daemon runs, but it starts no work.
  bool standby = 23;
  // The time of the commit its binary was built from.
  string build_time = 24;
  // What runs on the machine: capability status -> count (see Capabilities).
  map<string, int32> capability_counts = 25;
  // What sets slots: cpu or memory (measured: auto_slots) or owner (the
  // limit the owner set for this machine).
  string slots_by = 26;
  int32 auto_slots = 27;
}

// GpuStat is the live state of one GPU of a machine.
message GpuStat {
  string name = 1;
  double util_pct = 2;
  double mem_used_gb = 3;
  double mem_total_gb = 4;
  double temp_c = 5;
}

message SessionInfo {
  string agent = 1;
  string role = 2;
  string account = 3;
  string provider = 4;
  string model = 5;
  string effort = 6;
  string item_id = 7;
  string step = 8;
  string session_id = 9;
  string state = 10;
  string detail = 11;
  string at = 12;
  // The machine that runs the session.
  string machine = 13;
  // When the session started on this item and step.
  string since = 14;
  // Tokens and cost of the session so far (final when it ends).
  int64 tokens = 15;
  double cost_usd = 16;
}

// Event is one entry of the log; the CloudEvents form is served by /v1/events.
message Event {
  string id = 1;
  string type = 2;
  string project = 3;
  string subject = 4;
  string machine = 5;
  string actor = 6;
  string time = 7;
  int64 seq = 8;
  google.protobuf.Struct data = 9;
}

// ---------- requests and responses ----------

message ProjectRef {
  string project = 1;
}

message ItemRef {
  string project = 1;
  string id = 2;
}

// UnlockFilesRequest lets an item change locked files (existing tests,
// references, check scripts) the owner decided must change.
message UnlockFilesRequest {
  string project = 1;
  string item = 2;
  repeated string files = 3;
  string why = 4;
}

message ItemResponse {
  Item item = 1;
}

message ItemsResponse {
  repeated Item items = 1;
}

message CreateItemRequest {
  string project = 1;
  string title = 2;
  string body = 3;
  string kind = 4;
  string priority = 5;
  string area = 6;
  string goal_id = 7;
  string size = 8;
  string class = 9;
  repeated Criterion criteria = 10;
  repeated string preserve = 11;
  repeated string deps = 12;
  Anchors anchors = 13;
  repeated string checklist = 14;
  bool risky = 15;
  bool external = 16;
  string tracker_ref = 17;
  string lane = 18;
}

message CreateItemResponse {
  Item item = 1;
  Proposal proposal = 2;
  string note = 3;
}

message ListItemsRequest {
  string project = 1;
  string status = 2;
  string area = 3;
  string lane = 4;
  string goal = 5;
  string kind = 6;
  bool all = 7;
}

// UpdateItemRequest uses a JSON patch of the item fields to change
// (title, body, priority, area, size, class, criteria, preserve, deps,
// anchors, clarifications, checklist, risky, kind, reason).
message UpdateItemRequest {
  string project = 1;
  string id = 2;
  google.protobuf.Struct patch = 3;
}

message CloseItemRequest {
  string project = 1;
  string id = 2;
  // obsolete, duplicate, done_by, split or abandoned.
  string reason = 3;
  string by = 4;
  string note = 5;
}

message NextItemRequest {
  string project = 1;
}

message Assignment {
  string project = 1;
  Item item = 2;
  google.protobuf.Struct step = 3;
  bool new = 4;
  bool none = 5;
  string note = 6;
}

message DeliverRequest {
  string project = 1;
  Delivery delivery = 2;
}

message ReviewRequest {
  string project = 1;
  Review review = 2;
}

message ReportCheckRequest {
  string project = 1;
  CheckResult result = 2;
}

message ProposeRequest {
  string project = 1;
  Proposal proposal = 2;
}

message ProposeResponse {
  Proposal proposal = 1;
  string duplicate = 2;
  // item: the item made from a proposal that blocks its author's item (or
  // the item that already covers it), for the author to wait for.
  string item = 3;
}

message ListProposalsRequest {
  string project = 1;
  bool all = 2;
}

message ListProposalsResponse {
  repeated Proposal proposals = 1;
  repeated ProposalGroup groups = 2;
}

message DecideProposalRequest {
  string project = 1;
  string id = 2;
  // approve, reject or later.
  string decision = 3;
  string reason = 4;
}

message ProposalResponse {
  Proposal proposal = 1;
}

message AddTweakRequest {
  string project = 1;
  string area = 2;
  string text = 3;
}

message AddTweakResponse {
  Tweak tweak = 1;
  Item item = 2;
}

message AskOwnerRequest {
  string project = 1;
  Question question = 2;
}

message QuestionResponse {
  Question question = 1;
}

message QuestionsResponse {
  repeated Question questions = 1;
}

message AnswerRequest {
  string project = 1;
  string id = 2;
  string answer = 3;
  string note = 4;
}

message ApproveRequest {
  string project = 1;
  // I-42 or P-7.
  string target = 2;
  // plan, delivery or proposal: never approve without saying what.
  string what = 3;
  bool approve = 4;
  string note = 5;
}

message Empty {}

message SetGoalRequest {
  string project = 1;
  Goal goal = 2;
}

message SetGoalResponse {
  Goal goal = 1;
  repeated Item inventory = 2;
}

message FocusRequest {
  string project = 1;
  Focus focus = 2;
  string until = 3;
  bool preview = 4;
}

message FocusResponse {
  FocusEffect effect = 1;
  bool applied = 2;
}

message PauseRequest {
  string project = 1;
  string why = 2;
}

message StatusResponse {
  string project = 1;
  string machine = 2;
  bool paused = 3;
  string paused_why = 4;
  Goal goal = 5;
  GoalProgress progress = 6;
  Focus focus = 7;
  int32 focus_done = 8;
  int32 focus_all = 9;
  map<string, int32> counts = 10;
  repeated Item queue = 11;
  repeated Question waiting_owner = 12;
  repeated SessionInfo agents = 13;
  repeated Account accounts = 14;
  repeated Machine machines = 15;
  int32 open_proposals = 16;
  repeated string alerts = 17;
}

message MetricsRequest {
  string project = 1;
  // Go duration or days: 7d.
  string window = 2;
}

message MetricsResponse {
  string window = 1;
  double integrated_per_day = 2;
  map<string, int32> integrated_by_kind = 3;
  double rework_avg = 4;
  map<string, int32> rework_causes = 5;
  map<string, int64> tokens_by_model = 6;
  map<string, int64> tokens_by_role = 7;
  map<string, int64> tokens_by_item = 8;
  map<string, double> step_seconds = 9;
  double cache_hit_rate = 10;
  int32 proposals_made = 11;
  int32 proposals_approved = 12;
  string waiting_owner_max = 13;
  int32 violations = 14;
  int32 flaky_quarantined = 15;
  map<string, int32> explore_reads_by_area = 16;
  map<string, double> fixed_cost_ratio_by_area = 17;
  repeated string alerts = 18;
  // The numbers past their limit: rework_avg, proposals, waiting_owner,
  // flaky, violations.
  repeated string flags = 19;
}

message TimelineEntry {
  int64 seq = 1;
  string time = 2;
  string type = 3;
  string actor = 4;
  string machine = 5;
  string step = 6;
  string summary = 7;
  google.protobuf.Struct payload = 8;
}

message TimelineResponse {
  repeated TimelineEntry entries = 1;
}

message EstimateResponse {
  string item_id = 1;
  double hours = 2;
  int64 tokens = 3;
  double week_pct = 4;
  string account = 5;
  int32 based_on_items = 6;
}

message DigestResponse {
  string project = 1;
  repeated string integrated = 2;
  string goal = 3;
  repeated ProposalGroup proposals = 4;
  repeated string accounts = 5;
  repeated string waiting = 6;
  repeated string alerts = 7;
  string generated_at = 8;
  string text = 9;
}

message SendMessageRequest {
  string project = 1;
  Message message = 2;
}

message MessageResponse {
  Message message = 1;
}

message InboxRequest {
  string project = 1;
  string agent = 2;
  string role = 3;
  string item_id = 4;
  bool mark = 5;
}

message InboxResponse {
  repeated Message messages = 1;
}

message JournalRequest {
  string project = 1;
  string text = 2;
}

message ContextRequest {
  string project = 1;
  string id = 2;
  int32 budget = 3;
}

message ContextPart {
  int32 order = 1;
  string id = 2;
  string kind = 3;
  string title = 4;
  string body = 5;
  double relevance = 6;
  int32 tokens = 7;
}

message ContextResponse {
  string item_id = 1;
  repeated ContextPart parts = 2;
  repeated string cut = 3;
  int32 tokens = 4;
  int32 budget = 5;
  string text = 6;
}

message FindRequest {
  string project = 1;
  string query = 2;
  string kind = 3;
  string area = 4;
  string status = 5;
  string goal = 6;
  int32 limit = 7;
}

message SearchHit {
  string id = 1;
  string kind = 2;
  string title = 3;
  string summary = 4;
  string area = 5;
  string path = 6;
  string date = 7;
  int32 tokens = 8;
  double score = 9;
  string layer = 10;
}

message FindResponse {
  repeated SearchHit hits = 1;
}

message KnowledgeRequest {
  string project = 1;
  // An id (I-142, D-12), a path, path:line or a symbol, depending on the call.
  string target = 2;
}

message KnowledgeResponse {
  google.protobuf.Struct result = 1;
  string text = 2;
}

message RevalidateRequest {
  string project = 1;
  google.protobuf.Struct change = 2;
}

message RevalidateResponse {
  google.protobuf.Struct result = 1;
}

message QueueResponse {
  repeated Item items = 1;
  int32 integrated = 2;
}

message TakeoverResponse {
  Item item = 1;
  string worktree = 2;
}

message HandbackRequest {
  string project = 1;
  string id = 2;
  string note = 3;
}

message RedoRequest {
  string project = 1;
  string id = 2;
  string step = 3;
  string why = 4;
}

message AccountRequest {
  string project = 1;
  Account account = 2;
}

message AccountResponse {
  Account account = 1;
}

message AccountsResponse {
  repeated Account accounts = 1;
}

// AccountLogin is the login of one account on one machine, as the owner
// follows it: the provider's own login runs there, and shows where to sign in.
message AccountLogin {
  string machine = 1;
  string account = 2;
  string provider = 3;
  // running, done, failed or cancelled.
  string state = 4;
  // Where the owner signs in.
  string url = 5;
  // The one-time code to type on that page, when the provider gives one.
  string code = 6;
  // The login waits for the code the page shows after signing in.
  bool wants_code = 7;
  // The last lines the provider's login printed.
  repeated string lines = 8;
  string error = 9;
  string started_at = 10;
  string ended_at = 11;
}

message AccountLoginRequest {
  // The account (claude-1). Empty on start: a new account of the provider.
  string account = 1;
  // claude or codex. Needed on start for a new account.
  string provider = 2;
  // The machines to log in on; empty: this one. all: every connected machine.
  repeated string machines = 3;
  bool all = 4;
  // AnswerAccountLogin: the code the page showed, for the one machine named.
  string code = 5;
}

message AccountLoginResponse {
  string account = 1;
  repeated AccountLogin logins = 2;
}

message ReportUsageRequest {
  string project = 1;
  string account = 2;
  Usage usage = 3;
}

message MachinesResponse {
  repeated Machine machines = 1;
  repeated google.protobuf.Struct sessions = 2;
}

message MachineHistoryRequest {
  string project = 1;
  // One machine, or every machine when empty.
  string machine = 2;
  // How far back, as a duration ("15m", "2h"); empty = everything kept.
  string window = 3;
}

message MachineSample {
  string at = 1;
  double cpu_pct = 2;
  double mem_pct = 3;
  double temp_c = 4;
  // The busiest GPU.
  double gpu_pct = 5;
  // The hottest GPU.
  double gpu_temp_c = 6;
  int32 busy = 7;
  int32 slots = 8;
}

message MachineSeries {
  string machine = 1;
  repeated MachineSample samples = 2;
}

message MachineHistoryResponse {
  repeated MachineSeries series = 1;
}

message LeaveResponse {
  repeated string returned = 1;
}

// A machine this daemon is paired with.
message Peer {
  string name = 1;
  // True while this daemon holds a live connection to it.
  bool connected = 2;
}

message PeersResponse {
  repeated Peer peers = 1;
}

message StopPeersRequest {
  // Machines to stop; empty means every connected one.
  repeated string names = 1;
}

message PeerStop {
  string name = 1;
  bool stopped = 2;
  // Why it was not stopped, in a plain sentence.
  string error = 3;
}

message StopPeersResponse {
  repeated PeerStop results = 1;
}

// DiscussionMessage is one turn of the owner's conversation with the advisor
// about a decision (a question or an item).
// Part is one part of a repository (a backend, a web app, a mobile app,
// each with its own barnraise.yaml) and how its work goes.
message Part {
  string name = 1;
  string dir = 2;
  string about = 3;
  string stack = 4;
  string standard = 5;
  repeated string paths = 6;
  repeated string screens = 7;
  repeated string contracts = 8;
  // The flow each item kind goes through, and the steps of each flow.
  map<string, string> flows = 9;
  map<string, FlowSteps> flow_steps = 10;
  // Checks that run when this part is touched.
  repeated string checks = 11;
  // Its own barnraise.yaml; the text only for who may administer the project.
  string config_file = 12;
  string config = 13;
  // Items by board column, the open ones, the ones waiting for the owner,
  // what they cost and the last integration.
  map<string, int32> columns = 14;
  int32 open = 15;
  int32 needs_owner = 16;
  UsageTotals usage = 17;
  string last_integrated_at = 18;
}

message FlowSteps {
  repeated string steps = 1;
}

message PartsResponse {
  string project = 1;
  string config_file = 2;
  string config = 3;
  repeated Part parts = 4;
}

message DiscussionMessage {
  string thread = 1;
  string item_id = 2;
  // owner or advisor.
  string role = 3;
  string text = 4;
  string by = 5;
  string model = 6;
  int64 tokens = 7;
  string at = 8;
  // The answer the advisor proposes: an option (approve, reject or later
  // for a proposal) and what the owner would say with it.
  string suggest_option = 9;
  string suggest_note = 10;
  // The owner let the advisor decide, and this answer was applied.
  bool delegated = 11;
  // The autopilot left this decision to the owner; text says what to do.
  bool left_to_owner = 12;
}

// ProposalVerdict is the advisor's word on one open proposal.
message ProposalVerdict {
  string id = 1;
  // approve, reject or later.
  string decision = 2;
  string reason = 3;
}

message ProposalTriageResponse {
  repeated ProposalVerdict verdicts = 1;
}

message DiscussRequest {
  string project = 1;
  // The question (Q-7) or the item (I-43) the conversation is about.
  string thread = 2;
  string text = 3;
}

message DiscussionRef {
  string project = 1;
  string thread = 2;
}

// ChatDraft is the goal or the focus the advisor drafts from the owner's
// conversation (a thread CG-… or CF-…). Nothing is set: the owner reviews
// it in the form and sets it.
message ChatDraft {
  Goal goal = 1;
  Focus focus = 2;
  // until: how long the focus lasts, as the form takes it (3d, 12h), or empty.
  string until = 3;
}

message DiscussionResponse {
  repeated DiscussionMessage messages = 1;
}

message StandbyRequest {
  // True puts the machine in standby, false takes it out.
  bool on = 1;
  string why = 2;
  // Other machines to switch the same way, through this daemon.
  repeated string peers = 3;
}

// What a machine answered to a request sent through another one.
message PeerResult {
  string name = 1;
  bool ok = 2;
  // Why it did not do it, in a plain sentence.
  string error = 3;
}

// ShareProjectRequest asks other machines to work on a project too: each
// clones the project's repository and registers it.
message ShareProjectRequest {
  string project = 1;
  repeated string machines = 2;
  // Every connected machine.
  bool all = 3;
  // Register it paused there.
  bool paused = 4;
  // A token for the repository, for machines whose own git credential does
  // not reach it: each machine keeps it in its keychain, for this
  // repository only, and git reads it from there. Never logged or stored
  // in the event log.
  string token = 5;
}

message ShareProjectResponse {
  repeated PeerResult machines = 1;
}

// GitHubTokenSetup is how to create a GitHub token for a project: GitHub's
// form with everything filled in, and what each permission is for.
message GitHubTokenSetup {
  string project = 1;
  string repo = 2;
  // GitHub's new fine-grained token form, owner and permissions filled in.
  string url = 3;
  repeated GitHubPermission permissions = 4;
  // Where the token in use comes from on this machine, in a plain sentence.
  string current = 5;
}

message GitHubPermission {
  string name = 1;
  string access = 2;
  string why = 3;
}

// GitHubTokenRequest is a token to test and install on every machine.
message GitHubTokenRequest {
  string project = 1;
  string token = 2;
  // Only test it: install nothing.
  bool test_only = 3;
}

message GitHubTokenCheck {
  string name = 1;
  string access = 2;
  string why = 3;
  bool ok = 4;
  // False when GitHub offers no harmless test (workflows on a fine-grained token).
  bool testable = 5;
  string detail = 6;
}

// GitHubTokenMachine is one machine's test of the token, and whether it
// installed it.
message GitHubTokenMachine {
  string machine = 1;
  repeated GitHubTokenCheck checks = 2;
  bool installed = 3;
  string error = 4;
  // fine-grained, classic or oauth.
  string kind = 5;
  string expires = 6;
}

message GitHubTokenResponse {
  // Every machine passed and installed it.
  bool installed = 1;
  repeated GitHubTokenMachine machines = 2;
}

// AgentMCPStatus is what one machine says of one MCP server: never its
// env or headers.
message AgentMCPStatus {
  string machine = 1;
  // The machine has the server (in Claude's configuration or barnraise.yaml).
  bool found = 2;
  // project (.mcp.json), user or local (~/.claude.json), barnraise (barnraise.yaml).
  string source = 3;
  bool ok = 4;
  repeated string tools = 5;
  string error = 6;
  // RFC 3339.
  string tested_at = 7;
}

// AgentMCPServer is one MCP server across the cluster, and whether agents
// may use it.
message AgentMCPServer {
  string name = 1;
  // local (a command) or remote (a URL).
  string kind = 2;
  // The command, or the URL's host and path.
  string summary = 3;
  // In barnraise.yaml (mcp:): always given to its roles, changed there.
  bool from_yaml = 4;
  bool allowed = 5;
  // Roles that get it; empty: every role.
  repeated string roles = 6;
  // Hosts a local server reaches, opened in the egress proxy.
  repeated string hosts = 7;
  repeated AgentMCPStatus machines = 8;
}

message AgentMCPResponse {
  string project = 1;
  // The project's roles, to choose from.
  repeated string roles = 2;
  repeated AgentMCPServer servers = 3;
}

message AgentMCPGrantRequest {
  string project = 1;
  string name = 2;
  bool allowed = 3;
  repeated string roles = 4;
  repeated string hosts = 5;
}

message AgentMCPTestRequest {
  string project = 1;
  string name = 2;
}

message AgentMCPTestResponse {
  repeated AgentMCPStatus machines = 1;
}

message MaxAgentsRequest {
  // Agents at once on each machine named; 0 measures it from the machine.
  int32 max_agents = 1;
  // The machines; empty: this one.
  repeated string machines = 2;
}

message MaxAgentsResponse {
  repeated PeerResult machines = 1;
}

message StandbyResponse {
  bool on = 1;
  // Sessions of this machine stopped by the switch.
  int32 stopped = 2;
  repeated PeerResult peers = 3;
}

message CreateTokenRequest {
  string name = 1;
  string project = 2;
  repeated string scopes = 3;
  // Go duration or days: 30d. Empty: no expiry.
  string ttl = 4;
}

message Token {
  string id = 1;
  string name = 2;
  string project = 3;
  repeated string scopes = 4;
  string expires = 5;
  bool revoked = 6;
  string created = 7;
}

message CreateTokenResponse {
  Token token = 1;
  // Shown once.
  string secret = 2;
}

message TokensResponse {
  repeated Token tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

message AuditRequest {
  string project = 1;
  int32 limit = 2;
}

message AuditEntry {
  string time = 1;
  string actor = 2;
  string token_id = 3;
  string action = 4;
  string target = 5;
  string project = 6;
  string detail = 7;
}

message AuditResponse {
  repeated AuditEntry entries = 1;
}

message ProjectsResponse {
  repeated string projects = 1;
  string machine = 2;
  string version = 3;
  // This machine is in standby (see SetStandby), and why.
  bool standby = 4;
  string standby_why = 5;
  // The time of the commit this machine's binary was built from (RFC 3339).
  string build_time = 6;
  // A machine of the cluster runs a newer build: which, and what it runs.
  bool outdated = 7;
  string newest_machine = 8;
  string newest_version = 9;
  string newest_build_time = 10;
  // The daemon takes a newer peer's binary by itself, between sessions.
  bool self_update = 11;
  // The projects whose autopilot is on (SetAutopilot).
  repeated string autopilot = 12;
  // Why the advisor of a project cannot answer now (every account at its
  // limit, until when); absent when it can.
  map<string, string> advisor_down = 13;
}

// AutopilotRequest switches the autopilot: the advisor takes the owner's
// decisions (questions, approvals, proposals) and leaves only what it cannot.
message AutopilotRequest {
  string project = 1;
  bool on = 2;
  // Every project of this daemon, whatever project says.
  bool all = 3;
}

message ProjectAutopilot {
  string project = 1;
  bool on = 2;
  string error = 3;
}

message AutopilotResponse {
  repeated ProjectAutopilot projects = 1;
}

message PolicyViolationRequest {
  string project = 1;
  string item_id = 2;
  string agent = 3;
  string tool = 4;
  string rule = 5;
  string reason = 6;
  string excerpt = 7;
}

message EventsRequest {
  string project = 1;
  string subject = 2;
  repeated string types = 3;
  int64 after_seq = 4;
  int32 limit = 5;
}

message EventsResponse {
  repeated Event events = 1;
}

message RegisterProjectRequest {
  // Absolute path of a repository with a barnraise.yaml.
  string root = 1;
  // Pause every agent of the project before any of them can start, so the
  // owner can adopt work that already exists (accounts, item branches)
  // first. Lifted with Resume.
  bool paused = 2;
}

// BarnraiseService is the daemon's whole API. The CLI, the MCP server, the
// panel and any other interface use it.
// ---------- overview ----------

// UsageTotals adds up agent sessions: tokens, cost and time.
message UsageTotals {
  int64 input = 1;
  int64 output = 2;
  int64 cache_read = 3;
  int64 cache_write = 4;
  // The four above.
  int64 tokens = 5;
  double cost_usd = 6;
  // Seconds of agent sessions (two agents at once count twice).
  double seconds = 7;
  int32 sessions = 8;
  string last_at = 9;
  // Processor time of everything the sessions ran (the CLI, tests,
  // browsers, builds) and the most memory at once. 0 = not measured.
  double cpu_seconds = 10;
  int64 peak_rss_bytes = 11;
}

// ProcInfo is one process that runs for a worktree.
message ProcInfo {
  int32 pid = 1;
  string name = 2;
  // The program and its first plain arguments; options are left out.
  string command = 3;
  // agent, test, browser, build, emulator, runtime, container, git, shell or other.
  string kind = 4;
  // Share of one processor since the previous sample (200 = two busy).
  double cpu_pct = 5;
  int64 rss_bytes = 6;
  double cpu_seconds = 7;
  string started_at = 8;
}

// ProcSummary measures everything that runs for a worktree, an item or a machine.
message ProcSummary {
  int32 count = 1;
  double cpu_pct = 2;
  int64 rss_bytes = 3;
  map<string, int32> by_kind = 4;
  // The heaviest processes; the rest is in the totals.
  repeated ProcInfo top = 5;
  // Measured since the machine's daemon started; they stay after the processes end.
  double cpu_seconds = 6;
  int64 peak_rss_bytes = 7;
}

// WorktreeInfo is one directory a machine keeps for a project.
message WorktreeInfo {
  string machine = 1;
  string project = 2;
  string name = 3;
  // root, item, alt, refine, scratch, repro or trash.
  string kind = 4;
  string item_id = 5;
  string path = 6;
  // Empty when detached.
  string branch = 7;
  string head = 8;
  // A session or a check of that machine runs there right now.
  bool in_use = 9;
  // The worktree setup finished there (dependencies are installed).
  bool setup_done = 10;
  string modified_at = 11;
  // Measured in the background; sized_at is empty until the first measure ends.
  int64 size_bytes = 12;
  int64 files = 13;
  string sized_at = 14;
  ProcSummary procs = 15;
}

message CheckMark {
  string check = 1;
  bool passed = 2;
  bool flaky = 3;
  bool main_red = 4;
  string commit = 5;
  string runs_on = 6;
  double seconds = 7;
  int32 runs = 8;
  string at = 9;
}

message ReviewMark {
  string step = 1;
  string reviewer = 2;
  string decision = 3;
  string criteria_verdict = 4;
  string code_verdict = 5;
  int32 findings = 6;
  string at = 7;
}

message DeliveryMark {
  string step = 1;
  string agent = 2;
  string status = 3;
  string commit = 4;
  string at = 5;
}

message Activity {
  string type = 1;
  string machine = 2;
  string actor = 3;
  string at = 4;
}

// PullRequestView is an item's pull request. The state is derived from the
// item, not asked to the host.
message PullRequestView {
  int32 number = 1;
  string url = 2;
  // draft, ready, merged or closed.
  string state = 3;
}

// ItemOverview is everything known about one item, on every machine.
// FlowStep is one step of an item's flow and where the item is on it.
message FlowStep {
  string name = 1;
  // plan, work, approval, review, check or merge.
  string kind = 2;
  // done, current or next.
  string state = 3;
}

// Signal is the one fact to read about an item now, as a code and its
// argument, for a reader to word in its language.
message Signal {
  // approve, question, check_failed, changes_requested, waits_for, stalled,
  // working, running, queued, paused, parked, draft, ready, idle,
  // integrated, closed.
  string kind = 1;
  string arg = 2;
}

message ItemOverview {
  string id = 1;
  string title = 2;
  string kind = 3;
  int32 priority = 4;
  string lane = 5;
  string area = 6;
  string goal_id = 7;
  string size = 8;
  string class = 9;
  string status = 10;
  string step = 11;
  // working, refining, running, idle, stalled, waiting_owner, blocked,
  // paused, parked, queued, ready, draft, integrated or closed.
  string activity = 12;
  // Why it is where it is, when there is a why.
  string detail = 13;
  // Where the item is being worked on (its claim).
  string machine = 14;
  Claim claim = 15;
  string branch = 16;
  PullRequestView pr = 17;
  string tracker_ref = 18;
  bool adopted = 19;
  bool paused = 20;
  bool parked = 21;
  bool risky = 22;
  int32 tier = 23;
  int32 attempts = 24;
  int32 rework_rounds = 25;
  repeated string deps = 26;
  repeated string blocked_by = 27;
  string waiting_question = 28;
  int32 criteria_met = 29;
  int32 criteria_total = 30;
  string created_at = 31;
  string updated_at = 32;
  string step_started_at = 33;
  string integrated_at = 34;
  string merge_commit = 35;
  string closed_reason = 36;
  string closed_by = 37;
  // At the current step; since anything changed; from creation to integration (or to now).
  double step_seconds = 38;
  double quiet_seconds = 39;
  double lead_seconds = 40;
  repeated SessionInfo sessions = 41;
  repeated WorktreeInfo worktrees = 42;
  // What runs for the item on every machine, added up.
  ProcSummary procs = 43;
  UsageTotals usage = 44;
  map<string, UsageTotals> usage_by_step = 45;
  map<string, UsageTotals> usage_by_model = 46;
  map<string, UsageTotals> usage_by_machine = 47;
  map<string, UsageTotals> usage_by_role = 48;
  map<string, StepRun> runs = 49;
  repeated CheckMark checks = 50;
  int32 reviews = 51;
  ReviewMark last_review = 52;
  int32 deliveries = 53;
  DeliveryMark last_delivery = 54;
  Activity last_activity = 55;
  // What the owner's board shows, decided by the daemon: the flow's steps
  // with where the item is, what the owner approves now (plan or delivery),
  // the board column and the one fact to read first.
  repeated FlowStep flow = 56;
  string awaits = 57;
  bool needs_owner = 58;
  // backlog, working, needs, review, queue, blocked or done.
  string column = 59;
  Signal signal = 60;
  // The item's pages outside Barnraise, for the owner to open.
  ItemLinks links = 61;
}

// ItemLinks are an item's pages outside Barnraise; empty when unknown.
message ItemLinks {
  string issue = 1;
  string pr = 2;
  string branch = 3;
  // compare: the branch's changes against the main branch.
  string compare = 4;
  string commit = 5;
}

// ProjectOverview is one project across the cluster.
message ProjectOverview {
  string project = 1;
  bool paused = 2;
  string paused_why = 3;
  Goal goal = 4;
  GoalProgress progress = 5;
  Focus focus = 6;
  // Every item of the project, by status and by activity.
  map<string, int32> status = 7;
  map<string, int32> activity = 8;
  int32 open_questions = 9;
  int32 open_proposals = 10;
  // The items that match the request, after offset and limit.
  repeated ItemOverview items = 11;
  int32 items_matched = 12;
  int32 items_total = 13;
  bool truncated = 14;
  UsageTotals usage = 15;
  map<string, UsageTotals> usage_by_model = 16;
  map<string, UsageTotals> usage_by_role = 17;
  map<string, UsageTotals> usage_by_account = 18;
  map<string, UsageTotals> usage_by_machine = 19;
  map<string, UsageTotals> usage_by_agent = 20;
  // The last 30 days (UTC), by 2006-01-02.
  map<string, UsageTotals> usage_by_day = 21;
  repeated Account accounts = 22;
}

// MachineOverview is one machine across the projects.
message MachineOverview {
  Machine machine = 1;
  repeated string projects = 2;
  repeated SessionInfo sessions = 3;
  // The items this machine holds, as project/id.
  repeated string items = 4;
  repeated WorktreeInfo worktrees = 5;
  int64 worktree_bytes = 6;
  int64 disk_free_bytes = 7;
  int64 disk_total_bytes = 8;
  ProcSummary procs = 9;
  // False where the machine does not attribute processes to worktrees.
  bool procs_supported = 10;
  // When the machine last told what it keeps.
  string reported_at = 11;
  UsageTotals usage = 12;
}

message OverviewRequest {
  // Empty: every project the token may read.
  string project = 1;
  // Only this item.
  string item = 2;
  // Only these activities or statuses.
  repeated string activity = 3;
  // Only what is on this machine.
  string machine = 4;
  // Integrated and closed items of this long ago (Go duration or days: 7d). Default 7d.
  string finished = 5;
  // Every finished item, whatever its age.
  bool all = 6;
  // Items per project: default 500, at most 5000.
  int32 limit = 7;
  int32 offset = 8;
  // Without the per-item breakdowns and process lists.
  bool brief = 9;
}

message OverviewResponse {
  string generated_at = 1;
  // The machine that answered.
  string machine = 2;
  repeated ProjectOverview projects = 3;
  repeated MachineOverview machines = 4;
  map<string, int32> activity = 5;
  UsageTotals usage = 6;
  // The projects' usage added up.
  map<string, UsageTotals> usage_by_model = 7;
  map<string, UsageTotals> usage_by_role = 8;
  map<string, UsageTotals> usage_by_account = 9;
  map<string, UsageTotals> usage_by_machine = 10;
  map<string, UsageTotals> usage_by_day = 11;
}

message CapabilitiesRequest {
  repeated string machines = 1; // empty + all=false: this machine only
  bool all = 2;                 // every connected machine
  string project = 3;           // evaluate config-gated items for this project ("" = all projects of the machine)
  bool refresh = 4;             // probe again instead of the cached report
}

message CapabilityItem {
  string id = 1;        // e.g. sandbox.landlock, merge.structural, tools.rtk
  string title = 2;     // short English title
  string group = 3;     // security | isolation | merge | checks | context | tokens | worktrees | providers | telemetry
  string kind = 4;      // native | optional | plugin
  string status = 5;    // active | available | degraded | missing | unsupported
  string reason = 6;    // one plain sentence: why this status
  string fallback = 7;  // what runs instead when not active ("" when active)
  string fix = 8;       // exact command or config to make it active ("" when nothing to do)
  string tool = 9;      // installable tool id when `barnraise tools install <tool>` fixes it, else ""
  string version = 10;  // detected version of the tool/feature, if any
  bool needs_root = 11; // the fix needs root (shown, never automated)
  bool on = 12;         // a project or the machine switched it on (or it is always on)
}

message CapabilityTool {
  string id = 1;
  string title = 2;
  string installed = 3;  // installed version, "" if none
  string pinned = 4;     // version Barnraise installs
  bool managed = 5;      // installed by Barnraise (removable)
  bool available = 6;    // upstream ships a build for this machine's platform
  string path = 7;
}

message MachineCapabilities {
  string machine = 1;
  string platform = 2;
  string probed_at = 3; // RFC3339
  repeated CapabilityItem items = 4;
  repeated CapabilityTool tools = 5;
  map<string, int32> counts = 6; // status -> count
  string error = 7;              // the machine could not be reached / probed
}

message CapabilitiesResponse { repeated MachineCapabilities machines = 1; }

message InstallToolsRequest {
  repeated string tools = 1;
  repeated string machines = 2;
  bool all = 3;
  bool remove = 4;
}

message ToolInstallResult {
  string machine = 1;
  string tool = 2;
  bool ok = 3;
  string version = 4;
  string error = 5;
  bool changed = 6;
}

message InstallToolsResponse { repeated ToolInstallResult results = 1; }

service BarnraiseService {
  // Projects
  rpc ListProjects(Empty) returns (ProjectsResponse);
  rpc RegisterProject(RegisterProjectRequest) returns (ProjectsResponse);
  rpc ReloadProject(ProjectRef) returns (ProjectsResponse);

  // Items
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  // CreateItemFromChat writes an item from the owner's conversation with the
  // advisor (a thread C-…): the advisor turns it into the fixed shape.
  rpc CreateItemFromChat(DiscussionRef) returns (CreateItemResponse);
  rpc GetItem(ItemRef) returns (ItemResponse);
  rpc ListItems(ListItemsRequest) returns (ItemsResponse);
  rpc UpdateItem(UpdateItemRequest) returns (ItemResponse);
  // UnlockFiles lets an item change locked files; nobody edits them by hand.
  rpc UnlockFiles(UnlockFilesRequest) returns (ItemResponse);
  rpc CloseItem(CloseItemRequest) returns (ItemResponse);
  rpc NextItem(NextItemRequest) returns (Assignment);
  rpc Deliver(DeliverRequest) returns (ItemResponse);
  rpc SubmitReview(ReviewRequest) returns (ItemResponse);
  rpc ReportCheck(ReportCheckRequest) returns (ItemResponse);
  rpc Timeline(ItemRef) returns (TimelineResponse);
  rpc Estimate(ItemRef) returns (EstimateResponse);
  rpc Takeover(ItemRef) returns (TakeoverResponse);
  rpc Handback(HandbackRequest) returns (ItemResponse);
  rpc Redo(RedoRequest) returns (ItemResponse);

  // Proposals and tweaks
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  rpc DecideProposal(DecideProposalRequest) returns (ProposalResponse);
  rpc AddTweak(AddTweakRequest) returns (AddTweakResponse);

  // Owner
  rpc AskOwner(AskOwnerRequest) returns (QuestionResponse);
  rpc ListQuestions(ProjectRef) returns (QuestionsResponse);
  rpc Answer(AnswerRequest) returns (QuestionResponse);
  rpc Approve(ApproveRequest) returns (Empty);
  // Discuss sends the owner's message about a question or an item to the
  // advisor, a read-only agent with the strongest model, and returns the
  // conversation with its answer. It runs only when the owner writes, in
  // standby too.
  rpc Discuss(DiscussRequest) returns (DiscussionResponse);
  // ListParts describes the parts of a project (its areas with their own
  // barnraise.yaml) and how their work goes.
  rpc ListParts(ProjectRef) returns (PartsResponse);
  rpc GetDiscussion(DiscussionRef) returns (DiscussionResponse);
  // Delegate lets the advisor decide a question or a proposal in the
  // owner's place and applies the answer it suggests.
  rpc Delegate(DiscussionRef) returns (DiscussionResponse);
  // SetAutopilot lets the advisor take the owner's decisions in a project,
  // or in every project; only what it cannot resolve is left to the owner.
  rpc SetAutopilot(AutopilotRequest) returns (AutopilotResponse);
  // TriageProposals asks the advisor for a decision on every open proposal;
  // nothing is applied.
  rpc TriageProposals(ProjectRef) returns (ProposalTriageResponse);
  rpc SetGoal(SetGoalRequest) returns (SetGoalResponse);
  // DraftFromChat drafts a goal (thread CG-…) or a focus (thread CF-…) from
  // the owner's conversation with the advisor, without setting it.
  rpc DraftFromChat(DiscussionRef) returns (ChatDraft);
  // RunChecksInChat runs the project's checks on main (the commands of
  // barnraise.yaml, sandboxed, never the advisor) and posts their result
  // into the conversation; it returns once they started.
  rpc RunChecksInChat(DiscussionRef) returns (Empty);
  rpc SetFocus(FocusRequest) returns (FocusResponse);
  rpc ClearFocus(ProjectRef) returns (Empty);
  rpc Pause(PauseRequest) returns (Empty);
  rpc Resume(ProjectRef) returns (Empty);

  // Views
  rpc Status(ProjectRef) returns (StatusResponse);
  // The whole cluster in one answer: what each item is doing, on which
  // machine, with which worktrees, processes, pull request and cost. It is
  // answered from memory, whatever the size of the history.
  rpc Overview(OverviewRequest) returns (OverviewResponse);
  rpc Metrics(MetricsRequest) returns (MetricsResponse);
  rpc Digest(ProjectRef) returns (DigestResponse);
  rpc Queue(ProjectRef) returns (QueueResponse);
  rpc ProcessQueue(ProjectRef) returns (QueueResponse);
  rpc ListEvents(EventsRequest) returns (EventsResponse);

  // Messaging
  rpc SendMessage(SendMessageRequest) returns (MessageResponse);
  rpc Inbox(InboxRequest) returns (InboxResponse);
  rpc Journal(JournalRequest) returns (Empty);
  rpc ReportViolation(PolicyViolationRequest) returns (Empty);

  // Knowledge
  rpc Context(ContextRequest) returns (ContextResponse);
  rpc Find(FindRequest) returns (FindResponse);
  rpc Get(KnowledgeRequest) returns (KnowledgeResponse);
  rpc Related(KnowledgeRequest) returns (KnowledgeResponse);
  rpc Why(KnowledgeRequest) returns (KnowledgeResponse);
  rpc History(KnowledgeRequest) returns (KnowledgeResponse);
  rpc Rules(KnowledgeRequest) returns (KnowledgeResponse);
  rpc Revalidate(RevalidateRequest) returns (RevalidateResponse);
  rpc Sweep(ProjectRef) returns (RevalidateResponse);

  // Accounts and machines
  rpc UpsertAccount(AccountRequest) returns (AccountResponse);
  rpc ListAccounts(ProjectRef) returns (AccountsResponse);
  // StartAccountLogin starts the provider's login of one account on the
  // machines named, all at the same time. Each machine keeps its own login;
  // no credential travels between machines.
  rpc StartAccountLogin(AccountLoginRequest) returns (AccountLoginResponse);
  // GetAccountLogin tells how the login goes on each machine.
  rpc GetAccountLogin(AccountLoginRequest) returns (AccountLoginResponse);
  // AnswerAccountLogin hands a machine's login the code its page showed.
  rpc AnswerAccountLogin(AccountLoginRequest) returns (AccountLoginResponse);
  // CancelAccountLogin stops the logins that still run.
  rpc CancelAccountLogin(AccountLoginRequest) returns (AccountLoginResponse);
  rpc ReportUsage(ReportUsageRequest) returns (Empty);
  rpc ListMachines(ProjectRef) returns (MachinesResponse);
  // Recent readings of the machines (CPU, memory, temperature, GPU), kept in
  // memory by each daemon for charts. Never stored.
  rpc MachineHistory(MachineHistoryRequest) returns (MachineHistoryResponse);
  rpc LeaveMachine(ProjectRef) returns (LeaveResponse);
  // The other machines of the cluster, as this daemon sees them.
  rpc ListPeers(Empty) returns (PeersResponse);
  // Asks other machines to stop their daemon, as `barnraise down` does there.
  rpc StopPeers(StopPeersRequest) returns (StopPeersResponse);
  // Standby is the machine's own switch: in standby its daemon keeps
  // answering (status, panel, events between machines) and starts no agent,
  // check or merge. It is kept in the machine's configuration, so the daemon
  // starts the way it stopped.
  rpc SetStandby(StandbyRequest) returns (StandbyResponse);
  // SetMaxAgents sets how many agents each machine named runs at once.
  rpc SetMaxAgents(MaxAgentsRequest) returns (MaxAgentsResponse);
  // ShareProject has other machines clone a project's repository and
  // register it, so their agents work on it too.
  rpc ShareProject(ShareProjectRequest) returns (ShareProjectResponse);
  // How to create the project's GitHub token: a link to GitHub's form with
  // every permission Barnraise needs already filled in.
  rpc GetGitHubTokenSetup(ProjectRef) returns (GitHubTokenSetup);
  // Tests a GitHub token's permissions on this machine and, when they all
  // pass, installs it on every connected machine, each testing it again.
  rpc InstallGitHubToken(GitHubTokenRequest) returns (GitHubTokenResponse);
  // The MCP servers the machines have for a project, and which ones its
  // agents may use. The owner's own Claude keeps every server; agents get
  // only Barnraise's, barnraise.yaml's and the ones allowed here.
  rpc ListAgentMCP(ProjectRef) returns (AgentMCPResponse);
  // Lets agents use an MCP server (for some roles), or no longer.
  rpc SetAgentMCP(AgentMCPGrantRequest) returns (AgentMCPResponse);
  // Tests an MCP server on every connected machine now: the handshake and
  // the list of its tools.
  rpc TestAgentMCP(AgentMCPTestRequest) returns (AgentMCPTestResponse);
  // What is active on each machine, what falls back and why, and how to fix
  // it (ADR-0046). Owner and admin tokens only.
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  // Installs (or removes) the optional tools Barnraise ships recipes for,
  // without root, on this machine and the named ones.
  rpc InstallTools(InstallToolsRequest) returns (InstallToolsResponse);

  // Tokens and audit
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(Empty) returns (TokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (Empty);
  rpc ListAudit(AuditRequest) returns (AuditResponse);
}
