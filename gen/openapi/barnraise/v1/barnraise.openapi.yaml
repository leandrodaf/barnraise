components:
  schemas:
    barnraise.v1.Account:
      type: object
      properties:
        id:
          type: string
          title: id
        provider:
          type: string
          title: provider
        plan:
          type: string
          title: plan
        configDir:
          type: string
          title: config_dir
        linuxUser:
          type: string
          title: linux_user
        machine:
          type: string
          title: machine
        ceilingPct:
          oneOf:
            - type: number
              format: double
            - type: string
              enum:
                - NaN
                - Infinity
                - -Infinity
          title: ceiling_pct
        status:
          type: string
          title: status
        usage:
          title: usage
          $ref: '#/components/schemas/barnraise.v1.Usage'
        projects:
          type: array
          items:
            type: string
          title: projects
        addedAt:
          type: string
          title: added_at
        outlook:
          title: outlook
          description: The account seen from now; only in answers, never stored.
          $ref: '#/components/schemas/barnraise.v1.AccountOutlook'
        machines:
          type: array
          items:
            type: string
          title: machines
          description: |-
            Machines where the account was logged in from the panel or with
             `barnraise account login`, each with its own login under its data dir.
             With any name here, only these machines (and `machine`) use the account.
      title: Account
      additionalProperties: false
    barnraise.v1.AccountLogin:
      type: object
      properties:
        machine:
          type: string
          title: machine
        account:
          type: string
          title: account
        provider:
          type: string
          title: provider
        state:
          type: string
          title: state
          description: running, done, failed or cancelled.
        url:
          type: string
          title: url
          description: Where the owner signs in.
        code:
          type: string
          title: code
          description: The one-time code to type on that page, when the provider gives one.
        wantsCode:
          type: boolean
          title: wants_code
          description: The login waits for the code the page shows after signing in.
        lines:
          type: array
          items:
            type: string
          title: lines
          description: The last lines the provider's login printed.
        error:
          type: string
          title: error
        startedAt:
          type: string
          title: started_at
        endedAt:
          type: string
          title: ended_at
      title: AccountLogin
      additionalProperties: false
      description: |-
        AccountLogin is the login of one account on one machine, as the owner
         follows it: the provider's own login runs there, and shows where to sign in.
    barnraise.v1.AccountLoginRequest:
      type: object
      properties:
        account:
          type: string
          title: account
          description: 'The account (claude-1). Empty on start: a new account of the provider.'
        provider:
          type: string
          title: provider
          description: claude or codex. Needed on start for a new account.
        machines:
          type: array
          items:
            type: string
          title: machines
          description: 'The machines to log in on; empty: this one. all: every connected machine.'
        all:
          type: boolean
          title: all
        code:
          type: string
          title: code
          description: 'AnswerAccountLogin: the code the page showed, for the one machine named.'
      title: AccountLoginRequest
      additionalProperties: false
    barnraise.v1.AccountLoginResponse:
      type: object
      properties:
        account:
          type: string
          title: account
        logins:
          type: array
          items:
            $ref: '#/components/schemas/barnraise.v1.AccountLogin'
          title: logins
      title: AccountLoginResponse
      additionalProperties: false
    barnraise.v1.AccountOutlook:
      type: object
      properties:
        limited:
          type: boolean
          title: limited
          description: The account cannot take a step now.
        fiveHour:
          title: five_hour
          $ref: '#/components/schemas/barnraise.v1.UsageWindow'
        weekly:
          title: weekly
          $ref: '#/components/schemas/barnraise.v1.UsageWindow'
        weeklyTop:
          title: weekly_top
          $ref: '#/components/schemas/barnraise.v1.UsageWindow'
      title: AccountOutlook
      additionalProperties: false
      description: AccountOutlook is what the owner needs to know about an account now.
    barnraise.v1.AccountRequest:
      type: object
      properties:
        project:
          type: string
          title: project
        account:
          title: account
          $ref: '#/components/schemas/barnraise.v1.Account'
      title: AccountRequest
      additionalProperties: false
    barnraise.v1.AccountResponse:
      type: object
      properties:
        account:
          title: account
          $ref: '#/components/schemas/barnraise.v1.Account'
      title: AccountResponse
      additionalProperties: false
    barnraise.v1.AccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/barnraise.v1.Account'
          title: accounts
      title: AccountsResponse
      additionalProperties: false
    barnraise.v1.Activity:
      type: object
      properties:
        type:
          type: string
          title: type
        machine:
          type: string
          title: machine
        actor:
          type: string
          title: actor
        at:
          type: string
          title: at
      title: Activity
      additionalProperties: false
    barnraise.v1.AddTweakRequest:
      type: object
      properties:
        project:
          type: string
          title: project
        area:
          type: string
          title: area
        text:
          type: string
          title: text
      title: AddTweakRequest
      additionalProperties: false
    barnraise.v1.AddTweakResponse:
      type: object
      properties:
        tweak:
          title: tweak
          $ref: '#/components/schemas/barnraise.v1.Tweak'
        item:
          title: item
          $ref: '#/components/schemas/barnraise.v1.Item'
      title: AddTweakResponse
      additionalProperties: false
    barnraise.v1.Anchors:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
          title: files
        symbols:
          type: array
          items:
            type: string
          title: symbols
        areas:
          type: array
          items:
            type: string
          title: areas
        screens:
          type: array
          items:
            type: string
          title: screens
        contracts:
          type: array
          items:
            type: string
          title: contracts
        decisions:
          type: array
          items:
            type: string
          title: decisions
        specs:
          type: array
          items:
            type: string
          title: specs
        base:
          type: string
          title: base
      title: Anchors
      additionalProperties: false
    barnraise.v1.AnswerRequest:
      type: object
      properties:
        project:
          type: string
          title: project
        id:
          type: string
          title: id
        answer:
          type: string
          title: answer
        note:
          type: string
          title: note
      title: AnswerRequest
      additionalProperties: false
    barnraise.v1.ApproveRequest:
      type: object
      properties:
        project:
          type: string
          title: project
        target:
          type: string
          title: target
          description: I-42 or P-7.
        what:
          type: string
          title: what
          description: 'plan, delivery or proposal: never approve without saying what.'
        approve:
          type: boolean
          title: approve
        note:
          type: string
          title: note
      title: ApproveRequest
      additionalProperties: false
    barnraise.v1.AskOwnerRequest:
      type: object
      properties:
        project:
          type: string
          title: project
        question:
          title: question
          $ref: '#/components/schemas/barnraise.v1.Question'
      title: AskOwnerRequest
      additionalProperties: false
    barnraise.v1.Assignment:
      type: object
      properties:
        project:
          type: string
          title: project
        item:
          title: item
          $ref: '#/components/schemas/barnraise.v1.Item'
        step:
          title: step
          $ref: '#/components/schemas/google.protobuf.Struct'
        new:
          type: boolean
          title: new
        none:
          type: boolean
          title: none
        note:
          type: string
          title: note
      title: Assignment
      additionalProperties: false
    barnraise.v1.AuditEntry:
      type: object
      properties:
        time:
          type: string
          title: time
        actor:
          type: string
          title: actor
        tokenId:
          type: string
          title: token_id
        action:
          type: string
          title: action
        target:
          type: string
          title: target
        project:
          type: string
          title: project
        detail:
          type: string
          title: detail
      title: AuditEntry
      additionalProperties: false
    barnraise.v1.AuditRequest:
      type: object
      properties:
        project:
          type: string
          title: project
        limit:
          type: integer
          title: limit
          format: int32
      title: AuditRequest
      additionalProperties: false
    barnraise.v1.AuditResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/barnraise.v1.AuditEntry'
          title: entries
      title: AuditResponse
      additionalProperties: false
    barnraise.v1.AutopilotRequest:
      type: object
      properties:
        project:
          type: string
          title: project
        on:
          type: boolean
          title: on
        all:
          type: boolean
          title: all
          description: Every project of this daemon, whatever project says.
      title: AutopilotRequest
      additionalProperties: false
      description: |-
        AutopilotRequest switches the autopilot: the advisor takes the owner's
         decisions (questions, approvals, proposals) and leaves only what it cannot.
    barnraise.v1.AutopilotResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/barnraise.v1.ProjectAutopilot'
          title: projects
      title: AutopilotResponse
      additionalProperties: false
    barnraise.v1.CapabilitiesRequest:
      type: object
      properties:
        machines:
          type: array
          items:
            type: string
          title: machines
          description: 'empty + all=false: this machine only'
        all:
          type: boolean
          title: all
          description: every connected machine
        project:
          type: string
          title: project
          description: evaluate config-gated items for this project ("" = all projects of the machine)
        refresh:
          type: boolean
          title: refresh
          description: probe again instead of the cached report
      title: CapabilitiesRequest
      additionalProperties: false
    barnraise.v1.CapabilitiesResponse:
      type: object
      properties:
        machines:
          type: array
          items:
            $ref: '#/components/schemas/barnraise.v1.MachineCapabilities'
          title: machines
      title: CapabilitiesResponse
      additionalProperties: false
    barnraise.v1.CapabilityItem:
      type: object
      properties:
        id:
          type: string
          title: id
          description: e.g. sandbox.landlock, merge.structural, tools.rtk
        title:
          type: string
          title: title
          description: short English title
        group:
          type: string
          title: group
          description: security | isolation | merge | checks | context | tokens | worktrees | providers | telemetry
        kind:
          type: string
          title: kind
          description: native | optional | plugin
        status:
          type: string
          title: status
          description: active | available | degraded | missing | unsupported
        reason:
          type: string
          title: reason
          description: 'one plain sentence: why this status'
        fallback:
          type: string
          title: fallback
          description: what runs instead when not active ("" when active)
        fix:
          type: string
          title: fix
          description: exact command or config to make it active ("" when nothing to do)
        tool:
          type: string
          title: tool
          description: installable tool id when `barnraise tools install <tool>` fixes it, else ""
        version:
          type: string
          title: version
          description: detected version of the tool/feature, if any
        needsRoot:
          type: boolean
          title: needs_root
          description: the fix needs root (shown, never automated)
        on:
          type: boolean
          title: on
          description: a project or the machine switched it on (or it is always on)
      title: CapabilityItem
      additionalProperties: false
    barnraise.v1.CapabilityTool:
      type: object
      properties:
        id:
          type: string
          title: id
        title:
          type: string
          title: title
        installed:
          type: string
          title: installed
          description: installed version, "" if none
        pinned:
          type: string
          title: pinned
          description: version Barnraise installs
        managed:
          type: boolean
          title: managed
          description: installed by Barnraise (removable)
        available:
          type: boolean
          title: available
          description: upstream ships a build for this machine's platform
        path:
          type: string
          title: path
      title: CapabilityTool
      additionalProperties: false
    barnraise.v1.ChangeNote:
      type: object
      properties:
        type:
          type: string
          title: type
          description: feat, fix, perf, refactor, docs, test, build, ci, chore, style or revert.
        scope:
          type: string
          title: scope
          description: 'The part of the product: api, web, mobile…'
        subject:
          type: string
          title: subject
          description: Imperative, lower case, no final period, in English.
        body:
          type: string
          title: body
          description: Why, and what changes for people. Optional.
        breaking:
          type: string
          title: breaking
          description: What breaks and how to migrate. Empty when nothing does.
      title: ChangeNote
      additionalProperties: false
      description: |-
        ChangeNote describes a change in the form of Conventional Commits. It
         becomes the header of the commit that lands and a line of the changelog.
    barnraise.v1.CheckMark:
      type: object
      properties:
        check:
          type: string
          title: check
        passed:
          type: boolean
          title: passed
        flaky:
          type: boolean
          title: flaky
        mainRed:
          type: boolean
          title: main_red
        commit:
          type: string
          title: commit
        runsOn:
          type: string
          title: runs_on
        seconds:
          oneOf:
            - type: number
              format: double
            - type: string
              enum:
                - NaN
                - Infinity
                - -Infinity
          title: seconds
        runs:
          type: integer
          title: runs
          format: int32
        at:
          type: string
          title: at
      title: CheckMark
      additionalProperties: false
    barnraise.v1.CheckResult:
      type: object
      properties:
        id:
          type: string
          title: id
        itemId:
          type: string
          title: item_id
        check:
          type: string
          title: check
        commit:
          type: string
          title: commit
        passed:
          type: boolean
          title: passed
        flaky:
          type: boolean
          title: flaky
        summary:
          type: string
          title: summary
        logPath:
          type: string
          title: log_path
        logHash:
          type: string
          title: log_hash
        artifacts:
          type: array
          items:
            type: string
          title: artifacts
        duration:
          type: string
          title: duration
          format: int64
        criteria:
          type: array
          items:
            type: string
          title: criteria
        runsOn:
          type: string
          title: runs_on
        at:
          type: string
          title: at
      title: CheckResult
      additionalProperties: false
    barnraise.v1.Claim:
      type: object
      properties:
        machine:
          type: string
          title: machine
        agent:
          type: string
          title: agent
        since:
          type: string
          title: since
      title: Claim
      additionalProperties: false
    barnraise.v1.CloseItemRequest:
      type: object
      properties:
        project:
          type: string
          title: project
        id:
          type: string
          title: id
        reason:
          type: string
          title: reason
          description: obsolete, duplicate, done_by, split or abandoned.
        by:
          type: string
          title: by
        note:
          type: string
          title: note
      title: CloseItemRequest
      additionalProperties: false
    barnraise.v1.ContextPart:
      type: object
      properties:
        order:
          type: integer
          title: order
          format: int32
        id:
